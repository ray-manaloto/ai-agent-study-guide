name: Markdown Lint

on:
  push:
    branches: [main, feature/*]
    paths:
      - '**.md'
      - '.markdownlint.json'
      - '.github/workflows/markdown-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.md'
      - '.markdownlint.json'
      - '.github/workflows/markdown-lint.yml'

jobs:
  lint:
    name: Lint Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Create markdownlint config
        run: |
          cat > .markdownlint.json << 'EOF'
          {
            "default": true,
            "MD013": false,
            "MD033": false,
            "MD041": false,
            "MD024": {
              "siblings_only": true
            },
            "MD036": false,
            "MD046": false
          }
          EOF

      - name: Run markdownlint
        run: |
          markdownlint '**/*.md' \
            --ignore node_modules \
            --ignore .git \
            --ignore docs/codex-architecture.html

  prose:
    name: Check Prose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Vale prose linter
        uses: errata-ai/vale-action@v2
        with:
          files: '["README.md", "CONTRIBUTING.md", "docs/"]'
          fail_on_error: false
        continue-on-error: true

  spellcheck:
    name: Spellcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run spellcheck
        uses: streetsidesoftware/cspell-action@v5
        with:
          files: '**/*.md'
          config: |
            {
              "version": "0.2",
              "language": "en",
              "words": [
                "Codex",
                "codex",
                "OpenAI",
                "TUI",
                "Ratatui",
                "ratatui",
                "llms",
                "LLM",
                "API",
                "APIs",
                "JSON",
                "RPC",
                "async",
                "struct",
                "enum",
                "impl",
                "HNSW",
                "Mermaid",
                "mermaid"
              ],
              "ignorePaths": [
                "node_modules",
                ".git",
                "docs/codex-architecture.html"
              ]
            }
        continue-on-error: true

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [lint, prose, spellcheck]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "## Markdown Quality Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Markdown Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Prose Check | ${{ needs.prose.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Spellcheck | ${{ needs.spellcheck.result }} |" >> $GITHUB_STEP_SUMMARY
